version: 1

# Example: Antibody structure prediction with CDR3 conformation steering
# This example shows how to steer the CDR3 loop toward specific conformations

sequences:
  # Heavy chain antibody sequence (example sequence with CDR3 at residues 95-102)
  - protein:
      id: H
      sequence: "EVQLVESGGGLVQPGGSLRLSCAASGFNIKDTYIHWVRQAPGKGLEWVARIYPTNGYTRYADSVKGRFTISADTSKNTAYLQMNSLRAEDTAVYYCSRWGGDGFYAMDYWGQGTLVTVSS"

  # Light chain antibody sequence
  - protein:
      id: L
      sequence: "DIQMTQSPSSLSASVGDRVTITCRASQDVNTAVAWYQQKPGKAPKLLIYSASFLYSGVPSRFSGSRSGTDFTLTISSLQPEDFATYYCQQHYTTPPTFGQGTKVEIK"

constraints:
  # Steer heavy chain CDR3 (approximately residues 95-106 in this sequence)
  # toward an extended conformation
  - cdr3_conformation:
      chain_id: H
      start_res: 95  # 1-indexed
      end_res: 106
      conformation: extended  # Options: extended, compact, kinked, custom
      force: true

  # Alternative: use custom psi angle bounds (in degrees)
  # - cdr3_conformation:
  #     chain_id: H
  #     start_res: 95
  #     end_res: 106
  #     conformation: custom
  #     psi_lower: [120, 125, 130, 120, 125, 130, 120, 125, 130, 120]  # lower bounds in degrees
  #     psi_upper: [160, 155, 160, 160, 155, 160, 160, 155, 160, 160]  # upper bounds in degrees
  #     force: true

# Usage:
# boltz predict examples/cdr3_steering_example.yaml --use_potentials --cdr3_steering --out_dir ./output_cdr3
#
# With step-by-step mode:
# boltz predict examples/cdr3_steering_example.yaml --use_potentials --cdr3_steering --step_by_step --out_dir ./output_cdr3_stepwise
#
# CDR3 Conformation Options:
# - extended: psi angles ~120-160 degrees (elongated loop)
# - compact: psi angles ~-60 to -20 degrees (tight turn)
# - kinked: psi angles ~-20 to 20 degrees (sharp bend at apex)
# - custom: user-specified psi angle ranges
